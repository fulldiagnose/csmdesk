name: Build CSMDESK Windows x64

# Self-contained Windows x64 portable build for the CSMDESK fork.
#
# Why this file exists: the upstream replay chain (flutter-tag.yml ->
# flutter-build.yml -> bridge.yml) fails at startup on free-tier accounts and
# has many interlocking jobs; this workflow builds the Windows x64 artifact
# directly, reusing the same upstream scripts (build.py, libs/portable) so the
# output is identical in structure to the official portable exe.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  # Must match .github/workflows/bridge.yml / flutter-build.yml.
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FRB_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  RUST_VERSION: "1.75"

jobs:
  # Privacy mode "Mode 1" needs WindowInjection.dll. Upstream builds it in a
  # separate reusable workflow; we call the same one (x64 only, free runner).
  build-topmost-dll:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    runs-on: windows-2022
    needs: [build-topmost-dll]
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Read version from Cargo.toml
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          "CSMDESK_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version: $ver"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-csmdesk

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Install Flutter (bridge version)
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          architecture: x64

      - name: Install bridge codegen dependencies
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_VERSION }} --features "uuid" --locked
          flutter config --no-analytics

      - name: Prepare pubspec for Flutter 3.22.3
        shell: bash
        run: |
          # Same adjustment as .github/workflows/bridge.yml: extended_text 14
          # needs a newer Dart SDK than 3.22.3 ships.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Generate flutter-rust-bridge
        shell: bash
        run: |
          "$HOME/.cargo/bin/flutter_rust_bridge_codegen" \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Build Rust core + Flutter app (upstream build.py)
        shell: bash
        run: |
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Rename payload executable to CSMDESK.exe
        shell: bash
        run: |
          # The payload exe name decides three things at runtime:
          #   * the portable extraction dir (%LOCALAPPDATA%\<stem>)
          #   * the process image name (two apps both called rustdesk.exe
          #     collide in single-instance / tray detection)
          #   * whether the installer has to rename the copied exe to
          #     <APP_NAME>.exe - that rename is what failed with exit 9059
          #     and left C:\Program Files\CSMDESK without CSMDESK.exe.
          # Naming it CSMDESK.exe up front avoids all three.
          mv ./rustdesk/rustdesk.exe ./rustdesk/CSMDESK.exe
          ls -la ./rustdesk/*.exe

      - name: Add remote printer adapter
        shell: pwsh
        # Upstream downloads these in CI; without the adapter the app logs
        # "printer service init failed". Non-fatal: keep going if the CDN is down.
        continue-on-error: true
        run: |
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Expand-Archive printer_driver_adapter.zip -DestinationPath .
            Move-Item -Force .\printer_driver_adapter.dll .\rustdesk\printer_driver_adapter.dll
            Write-Host "printer adapter added"
          } catch {
            Write-Warning "printer adapter download failed: $_"
          }
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
            New-Item -ItemType Directory -Force -Path .\rustdesk\drivers | Out-Null
            Move-Item -Force .\rustdesk_printer_driver_v4-1.4 .\rustdesk\drivers\RustDeskPrinterDriver
            Write-Host "printer driver added"
          } catch {
            Write-Warning "printer driver download failed: $_"
          }

      - name: Add virtual display driver package (privacy mode Mode 2)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe","usbmmidd_v2\deviceinstaller.exe","usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
          Move-Item -Force .\usbmmidd_v2 .\rustdesk\usbmmidd_v2

      - name: Download WindowInjection.dll (privacy mode Mode 1)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: ./topmost

      - name: Place WindowInjection.dll next to the app
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path .\topmost -Recurse -Filter WindowInjection.dll | Select-Object -First 1
          if (-not $dll) { throw "WindowInjection.dll not found in artifact" }
          Copy-Item $dll.FullName .\rustdesk\WindowInjection.dll
          Write-Host "placed at rustdesk\WindowInjection.dll"

      - name: Build portable single exe
        shell: bash
        run: |
          pip3 install -r libs/portable/requirements.txt
          cd libs/portable
          python3 ./generate.py -f ../../rustdesk -o . -e ../../rustdesk/CSMDESK.exe
          cd ../..
          mkdir -p SignOutput
          mv ./target/release/rustdesk-portable-packer.exe \
             "./SignOutput/CSMDESK-${CSMDESK_VERSION}-x64.exe"
          ls -la SignOutput

      - name: Verify branding of the produced exe
        shell: pwsh
        run: |
          $f = Get-ChildItem .\SignOutput\CSMDESK-*.exe | Select-Object -First 1
          if (-not $f) { throw "no exe produced" }
          $v = $f.VersionInfo
          "{0}`n  ProductName : {1}`n  Description : {2}`n  Version     : {3}" -f $f.Name, $v.ProductName, $v.FileDescription, $v.FileVersion | Write-Host
          if ($v.ProductName -ne 'CSMDESK') { throw "ProductName is '$($v.ProductName)', expected CSMDESK" }
          Write-Host "branding OK"

      - name: Upload artifact (always, even without a tag)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CSMDESK-windows-x64
          path: SignOutput/CSMDESK-*.exe
          if-no-files-found: error

      - name: Publish release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ github.ref_name }}
          files: SignOutput/CSMDESK-*.exe
          fail_on_unmatched_files: true
